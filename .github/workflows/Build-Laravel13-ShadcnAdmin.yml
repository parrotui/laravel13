name: Build Laravel 13 + Shadcn Admin

on:
  push:
    branches:
      - 13.x
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  build:
    name: Build Production Package
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. PHP 8.4
      # --------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, intl, pdo_mysql
          tools: composer:v2
          coverage: none

      # --------------------------------------------------
      # 3. Node.js 24
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --------------------------------------------------
      # 4. Install pnpm
      # --------------------------------------------------
      - name: Install pnpm
        run: |
          npm install --global pnpm@${PNPM_VERSION}
          pnpm --version
          node --version
          npm --version

      # --------------------------------------------------
      # 5. Composer
      # --------------------------------------------------
      - name: Install Composer Dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      # --------------------------------------------------
      # 6. Install root frontend dependencies
      # --------------------------------------------------
      - name: Install Root Frontend Dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          pnpm install --frozen-lockfile

      # --------------------------------------------------
      # 7. Build root frontend
      # --------------------------------------------------
      - name: Build Root Frontend
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          pnpm build

      # --------------------------------------------------
      # 8. Install Shadcn Admin
      # --------------------------------------------------
      - name: Install Shadcn Admin Dependencies
        if: hashFiles('admin/pnpm-lock.yaml') != ''
        working-directory: admin
        run: |
          pnpm install --frozen-lockfile

      # --------------------------------------------------
      # 9. Build Shadcn Admin
      # --------------------------------------------------
      - name: Build Shadcn Admin
        if: hashFiles('admin/pnpm-lock.yaml') != ''
        working-directory: admin
        run: |
          pnpm build

      # --------------------------------------------------
      # 10. Prepare release
      # --------------------------------------------------
      - name: Prepare Production Package
        run: |
          rm -rf release
          mkdir -p release

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='admin/node_modules' \
            --exclude='tests' \
            --exclude='storage/logs/*' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./ release/

      # --------------------------------------------------
      # 11. Copy React production build
      # --------------------------------------------------
      - name: Copy Shadcn Admin Build
        if: hashFiles('admin/dist/**') != ''
        run: |
          mkdir -p release/public/admin

          rsync -a \
            admin/dist/ \
            release/public/admin/

      # --------------------------------------------------
      # 12. Remove development files
      # --------------------------------------------------
      - name: Clean Production Package
        run: |
          rm -rf release/.git
          rm -rf release/.github
          rm -rf release/node_modules
          rm -rf release/admin/node_modules
          rm -rf release/admin/src

          rm -f release/.env
          rm -f release/.env.*

          find release -type f -name '*.map' -delete

      # --------------------------------------------------
      # 13. Laravel optimization
      # --------------------------------------------------
      - name: Laravel Production Optimization
        working-directory: release
        run: |
      # --------------------------------------------------
      # 14. Build information
      # --------------------------------------------------
      - name: Generate Build Information
        run: |
          echo "APP_VERSION=${GITHUB_SHA}" > release/build-info.txt
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> release/build-info.txt
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release/build-info.txt
          echo "PHP_VERSION=${PHP_VERSION}" >> release/build-info.txt
          echo "NODE_VERSION=${NODE_VERSION}" >> release/build-info.txt
          echo "PNPM_VERSION=${PNPM_VERSION}" >> release/build-info.txt

      # --------------------------------------------------
      # 15. Create production archive
      # --------------------------------------------------
      - name: Create Production Archive
        run: |
          mkdir -p artifacts

          tar \
            -czf \
            artifacts/laravel13-shadcn-admin-${GITHUB_SHA::7}.tar.gz \
            -C release .

      # --------------------------------------------------
      # 16. SHA256
      # --------------------------------------------------
      - name: Generate SHA256
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt

      # --------------------------------------------------
      # 17. Upload Artifact
      # --------------------------------------------------
      - name: Upload Production Package
        uses: actions/upload-artifact@v6
        with:
          name: laravel13-shadcn-admin
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          retention-days: 30
