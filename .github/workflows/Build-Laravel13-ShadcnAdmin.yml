name: Build Laravel 13 + Shadcn Admin

on:
  push:
    branches:
      - 13.x
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'

jobs:
  build:
    name: Build Production Package
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. 拉取代码
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. PHP 8.4
      # --------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, intl, pdo_mysql, redis
          tools: composer:v2
          coverage: none

      # --------------------------------------------------
      # 3. Node.js 24
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            admin/pnpm-lock.yaml

      # --------------------------------------------------
      # 4. pnpm
      # --------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # --------------------------------------------------
      # 5. 检查 PHP
      # --------------------------------------------------
      - name: PHP Version
        run: |
          php -v
          composer --version

      # --------------------------------------------------
      # 6. 安装 Laravel Composer 生产依赖
      # --------------------------------------------------
      - name: Install Composer Dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      # --------------------------------------------------
      # 7. 安装 Laravel 前端依赖
      # --------------------------------------------------
      - name: Install Root Frontend Dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          pnpm install --frozen-lockfile

      # --------------------------------------------------
      # 8. 安装 Shadcn Admin
      # --------------------------------------------------
      - name: Install Shadcn Admin Dependencies
        working-directory: admin
        run: |
          pnpm install --frozen-lockfile

      # --------------------------------------------------
      # 9. 构建 Shadcn Admin
      # --------------------------------------------------
      - name: Build Shadcn Admin
        working-directory: admin
        run: |
          pnpm build

      # --------------------------------------------------
      # 10. 创建生产环境目录
      # --------------------------------------------------
      - name: Prepare Production Package
        run: |
          rm -rf release
          mkdir -p release

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='admin/node_modules' \
            --exclude='tests' \
            --exclude='storage/logs/*' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./ release/

      # --------------------------------------------------
      # 11. 复制 Shadcn Admin 编译结果
      # --------------------------------------------------
      - name: Copy Admin Build
        run: |
          mkdir -p release/public/admin

          rsync -a \
            admin/dist/ \
            release/public/admin/

      # --------------------------------------------------
      # 12. 删除开发文件
      # --------------------------------------------------
      - name: Clean Production Package
        run: |
          rm -rf release/.git
          rm -rf release/.github
          rm -rf release/node_modules
          rm -rf release/admin/node_modules
          rm -rf release/admin/src

          rm -f release/.env
          rm -f release/.env.*

          find release -type f -name '*.map' -delete

      # --------------------------------------------------
      # 13. 生成版本信息
      # --------------------------------------------------
      - name: Generate Build Information
        run: |
          echo "APP_VERSION=${GITHUB_SHA}" > release/build-info.txt
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> release/build-info.txt
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release/build-info.txt
          echo "PHP_VERSION=${PHP_VERSION}" >> release/build-info.txt
          echo "NODE_VERSION=${NODE_VERSION}" >> release/build-info.txt

      # --------------------------------------------------
      # 14. 打包
      # --------------------------------------------------
      - name: Create Production Archive
        run: |
          mkdir -p artifacts

          tar \
            --exclude='release/storage/logs/*' \
            -czf \
            artifacts/laravel13-shadcn-admin-${GITHUB_SHA::7}.tar.gz \
            -C release .

      # --------------------------------------------------
      # 15. 生成 SHA256
      # --------------------------------------------------
      - name: Generate SHA256
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt

      # --------------------------------------------------
      # 16. 上传 GitHub Artifact
      # --------------------------------------------------
      - name: Upload Production Package
        uses: actions/upload-artifact@v6
        with:
          name: laravel13-shadcn-admin
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          retention-days: 30
