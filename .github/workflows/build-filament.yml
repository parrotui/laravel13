name: Build Laravel 13 + Filament 5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 13.x
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml, ctype, curl, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Check Environment
        run: |
          php -v
          composer -V

      - name: Install Laravel Dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Install Filament 5
        run: |
          composer require filament/filament:^5.0 \
            --with-all-dependencies \
            --no-interaction \
            --no-progress

      - name: Install Filament Panel
        run: |
          php artisan filament:install --panels

      - name: Check Versions
        run: |
          php artisan --version
          composer show filament/filament

      - name: Prepare Deployment Package
        run: |
          mkdir -p deploy

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="tests" \
            ./ deploy/

      - name: Create ZIP
        run: |
          cd deploy
          zip -r ../laravel13-filament5.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel13-filament5
          path: laravel13-filament5.zip
          retention-days: 7
