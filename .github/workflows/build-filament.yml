name: Build Laravel 13 + Shadcn Admin

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    name: Build Production Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: 13.x
          fetch-depth: 1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml, ctype, curl, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check Environment
        run: |
          php -v
          composer -V
          node -v
          npm -v

      - name: Check Laravel Environment
        run: |
          test -f .env.example
          echo ".env.example found"

      - name: Install Composer Dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader \
            --no-dev

      - name: Check Frontend Configuration
        run: |
          test -f package.json
          echo "package.json found"
          cat package.json

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Build Frontend
        run: |
          npm run build

      - name: Check Versions
        run: |
          php artisan --version
          composer show
          echo ""
          echo "Frontend build:"
          ls -lah public/build

      - name: Prepare Deployment Package
        run: |
          mkdir -p deploy

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="tests" \
            --exclude="storage/logs/*" \
            ./ deploy/

      - name: Verify Deployment Package
        run: |
          test -f deploy/artisan
          test -f deploy/composer.json
          test -f deploy/composer.lock
          test -f deploy/vendor/autoload.php
          test -f deploy/.env.example
          test -f deploy/public/index.php

          echo "Deployment package verified."

          echo ""
          echo "Package size:"
          du -sh deploy

          echo ""
          echo "Vendor size:"
          du -sh deploy/vendor

          echo ""
          echo "Frontend build size:"
          du -sh deploy/public/build

      - name: Create Production ZIP
        run: |
          cd deploy

          zip -r \
            ../laravel13-shadcn-admin-production.zip \
            .

      - name: Generate SHA256
        run: |
          sha256sum \
            laravel13-shadcn-admin-production.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v5
        with:
          name: laravel13-shadcn-admin-production
          path: |
            laravel13-shadcn-admin-production.zip
            SHA256SUMS.txt
          retention-days: 30
