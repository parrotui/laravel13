name: Build Laravel 13 + Filament 5

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: 13.x
          fetch-depth: 1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml, ctype, curl, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check Environment
        run: |
          php -v
          composer -V
          node -v
          npm -v

      - name: Install Composer Dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      - name: Install Filament 5
        run: |
          composer require filament/filament:^5.0 \
            --with-all-dependencies \
            --no-interaction \
            --no-progress

      - name: Install Filament Panel
        run: |
          php artisan filament:install --panels

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Build Frontend
        run: |
          npm run build

      - name: Check Versions
        run: |
          php artisan --version
          composer show filament/filament
          echo "Frontend build:"
          ls -lah public/build

      - name: Prepare Deployment Package
        run: |
          mkdir -p deploy

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="tests" \
            ./ deploy/

      - name: Create Production ZIP
        run: |
          cd deploy
          zip -r ../laravel13-filament5-production.zip .

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v5
        with:
          name: laravel13-filament5-production
          path: laravel13-filament5-production.zip
          retention-days: 7
