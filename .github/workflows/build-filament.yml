name: Build Laravel 13 + Filament 5

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. 获取 13.x 分支
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: 13.x
          fetch-depth: 1

      # ==========================================
      # 2. PHP 8.4
      # ==========================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml, ctype, curl, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      # ==========================================
      # 3. 检查环境
      # ==========================================
      - name: Check Environment
        run: |
          php -v
          composer -V

      # ==========================================
      # 4. 安装 Laravel Composer 依赖
      # ==========================================
      - name: Install Laravel Dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      # ==========================================
      # 5. 安装 Filament 5
      # ==========================================
      - name: Install Filament 5
        run: |
          composer require filament/filament:^5.0 \
            --with-all-dependencies \
            --no-interaction \
            --no-progress

      # ==========================================
      # 6. 初始化 Filament
      # ==========================================
      - name: Install Filament Panel
        run: |
          php artisan filament:install --panels

      # ==========================================
      # 7. 检查 Laravel / Filament 版本
      # ==========================================
      - name: Check Versions
        run: |
          php artisan --version
          composer show filament/filament

      # ==========================================
      # 8. 准备部署文件
      # ==========================================
      - name: Prepare Deployment Package
        run: |
          mkdir -p deploy

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="tests" \
            ./ deploy/

      # ==========================================
      # 9. 创建 ZIP
      # ==========================================
      - name: Create ZIP
        run: |
          cd deploy
          zip -r ../laravel13-filament5.zip .

      # ==========================================
      # 10. 上传 Artifact
      # ==========================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: laravel13-filament5
          path: laravel13-filament5.zip
          retention-days: 7
